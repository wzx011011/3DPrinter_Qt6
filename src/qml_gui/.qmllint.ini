; S8 (2026-10-14): qmllint gate configuration for the OWzx QML module
; (values = the Qt 6.12.0 qmllint --write-defaults category set, verified).
; Canonical verify runs the CMake target all_qmllint (wired in
; scripts/auto_verify_with_vcvars.ps1) with a 0-error gate: findings at level
; error fail the build, warnings do not. This file pins that contract so a
; qmllint upgrade cannot silently promote a reviewed-warnings category to a
; gate error.
;
; Known non-gating inventory (2026-10-14, module OWzx, 84 files, 0 errors):
;   UnqualifiedAccess ~570 - nested access to delegate-root required
;       properties / enclosing ids (works at runtime; qmllint prefers
;       qualified access), plus GLViewport / ConfigOptionFilterProxy:
;       runtime-registered module types (the same-name viewport swap and the
;       core-owned filter proxy cannot be QML_ELEMENT until owzx_app_core
;       leaves OBJECT-library status - recorded in docs plan section 6c).
;   MissingProperty ~140 - dynamic ViewModel surface qmllint cannot see
;       (pre-existing inventory from the M2.5/G2 collection pass).
;   Quick.LayoutsPositioning / Index / IncompatibleType - pre-existing.
;
; pragma ComponentBehavior: Bound is mandatory project-wide (84/84 files).
