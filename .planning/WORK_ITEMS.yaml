  - id: PLATE-DELETE-DOCK
    title: delete_plate moves instances off-plate (upstream unprintable dock)
      instead of merging into neighbor
    aliases: ["GAP-2"]
    area: Prepare/Plate
    priority: P1
    status: resolved
    resolved: 2026-09-08
    implementation: real
    parity: aligned
    verification: pass
    availability: available
    upstream:
      repo: third_party/OrcaSlicer
      refs:
        - src/slic3r/GUI/PartPlate.cpp:3708-3816 (delete_plate ->
          compute_origin_for_unprintable + with_instance_move),
          :2483-2498 (move_instances_to intersects only the last plate)
    qt_targets:
      - src/core/model/PartPlateList.cpp (deletePlate)
      - tests/PartPlateTests.cpp::deletePlateMigratesInstancesToNeighbor
    notes: >
      Resolved 2026-09-08 in the review-fix batch (commit 2e513ec): upstream
      delete_plate teleports the deleted plate's instances to the unprintable
      dock (PartPlate.cpp:3761) BEFORE the move_instances_to intersect test
      (:2483-2497, :3810), so instances virtually never join a neighbor --
      the net behavior is docking. Qt6 deletePlate clears memberships
      without a neighbor merge, and ProjectServiceMock::deletePlate moves
      each fully-orphaned OBJECT to the dock slot
      (compute_origin_for_unprintable formula via computeOrigin(plateCount,
      plateCols)) so rebuild/arrange passes cannot reabsorb it; per-instance
      orphans whose object still lives on another plate stay put.
      deletePlateMigratesInstancesToNeighbor rewritten to the dock contract.
      Undo fidelity holds: the deep plate snapshot restores members with
      their pre-delete transforms.
    evidence:
      commits: [2e513ec]
      gate: full ninja -t clean rebuild, canonical run EXIT=0 2026-09-08,
        12 suites 577 tests 0 failed 0 skipped
      last_verified: 2026-09-08

