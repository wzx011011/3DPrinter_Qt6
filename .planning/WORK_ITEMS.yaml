      bed; locked plates keep items fixed and get no tower. The upstream
      paint-color / bed-temperature tower gates are not observable from the
      service layer (documented scope note); the extruder-count and smooth-
      timelapse gates cover the dominant cases. Item closed: the drop /
      out-of-bounds consumer concern was re-audited 2026-09-07 -- upstream
      OnDropFiles loads into the CURRENT plate (no under-cursor plate
