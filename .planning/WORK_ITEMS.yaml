  # ── Freeze investigation 2026-09-12 (interactive acceptance blocker) ─────
  - id: QSG-DXGI-VSYNC-FREEZE
    title: Silent UI freeze at launch — Quick render thread blocked forever on
      QWaitCondition::wait because Qt 6.10 QDxgiVSyncService callbacks never
      fire on AMD amdxx64 / Win11 build 26200 (WaitForVBlank returns <=1 ms)
    aliases: []
    area: QPA/Rendering
    priority: P0
    status: resolved
    resolved: 2026-09-12
    implementation: real
    parity: known_deviation
    verification: pass
    availability: available
    notes:
      Symptom (7+ repros, 100% at launch on the dev machine): after the
      first frames the window never presents again — status-bar clock stuck,
      clicks/page switches processed invisibly, resize or tab expose forces
      exactly one frame, process Responding=True, no crash, no log errors.
      Root cause chain (proven from Qt 6.10 sources + cdb):
      QWindowsWindow::requestUpdate() registers a QDxgiVSyncService callback
      and stops the platform timer fallback whenever supportsWindow() is
      true; QDxgiVSyncThread::run() only fires that callback when
      IDXGIOutput::WaitForVBlank takes >1 ms; on this machine it fails or
      returns instantly so the thread msleeps forever and the callback never
      runs; the threaded render loop therefore never receives
      handleUpdateRequest and the render thread parks in
      QWaitCondition::wait (Qt6Quick +0x9481/+0xa098 frames in cdb dumps)
      while the GUI thread stays healthy in its dispatcher wait — exactly
      the observed split. Excluded along the way: Windows update (9/8
      hotfixes predate good runs), machine-wide Qt breakage (Qt Test gate
      suites green), message-pump death (PostThreadMessage to the internal
      qt_internal_proc windows flushed fine), WebEngine init (A/B refuted).
      Fix: default QT_D3D_NO_VBLANK_THREAD=1 before QGuiApplication in
      main_qml.cpp (Qt's own escape hatch, read once at service
      construction; supportsWindow() then returns false and requestUpdate()
      uses the timer fallback). User-set value is respected. A/B on an
      identical SendInput/screenshot harness: clean build freezes (fresh
      cdb dump shows the same dead render-thread wait), fixed build presents
      tab switches, orbit drags mid-gesture, wheel zoom, middle-drag pan,
      keyboard I/O zoom and Tab page switch, and the status clock advances.
      Known deviation: vsync-aligned frame pacing is replaced by the ~5 ms
      timer fallback (pre-6.10 Qt behavior); acceptable for a slicer and
      strictly better than no presentation. The earlier follow-up note
      blaming viewport clicks was wrong (RhiViewport has no focus calls and
      a plain QQuickItem press does not take active focus): the focus-map
      experiment proved topbar/sidebar CONTROL clicks take active focus and
      kill the page-level Keys.onPressed. Resolved by CANVAS-FOCUS-KEYS.
    evidence:
      gate: canonical gate 2026-09-12 -- exit 0, 12 suites 0 failed
        (rebuild includes the fix); interactive A/B evidence in
        build/acc_shots (AB_novblank_*, AB_clean_*, ACC_0..6, FK_0..2,
        DRAG_*) plus cdb thread dumps /tmp/all_stacks2.txt (frozen),
        /tmp/ab_stacks.txt (fixed, render thread in QRhi::beginFrame),
        /tmp/clean_t3.txt (clean freeze reproduced)
      commit: b72ec2f (fix(qpa): default QT_D3D_NO_VBLANK_THREAD=1 ...)
      last_verified: 2026-09-12

  - id: CANVAS-FOCUS-KEYS
    title: Canvas hotkeys dead at fresh launch and after clicking any toolbar/sidebar control
    aliases: ["HOTKEY-FWD", "HOTKEY-FOCUS-FORWARD"]
    area: Shell/Shortcuts
    priority: P1
    status: resolved
    resolved: 2026-09-13
    implementation: real
    parity: aligned
    verification: pass
    availability: available
    notes:
      Root cause established by instrumentation (KEYTRACE console probes +
      a 6 s activeFocusItem tick probe on a fresh launch): at startup the
      activeFocusItem is the PLATER ROOT (Plater.qml root focus:true wins the
      initial grab), which has no Keys handler -- letter keys never reached
      the page-root Keys.onPressed. A second empirical finding killed the
      first fix attempt: a Keys attached handler on the ApplicationWindow is
      silently never invoked for unhandled keys in Qt 6.10 (installed without
      warning, zero traces on keypress), so window-level forwarding is not a
      viable mechanism. Theory correction: upstream plater letter keys are
      CANVAS events (GLCanvas3D receives wxEVT_CHAR as the focused child; a
      wx sidebar control holding focus swallows them too) -- NOT the main
      frame accelerator table as first assumed. Therefore the parity contract
      is canvas-focus semantics, not focus-independent forwarding. Final fix
      (canvas-focus model): PreparePage/PreviewPage claim activeFocus via
      onVisibleChanged + a deferred timer whenever they become visible
      (covers fresh launch, page switches, popup close); RhiViewport and
      SoftwareViewport call forceActiveFocus() in mousePressEvent (upstream
      GLCanvas mouse-down grabs focus); Tab/Shift+Tab remain window
      Shortcuts gated on !textEditHoldFocus because focus navigation eats
      Tab before item Keys; Plater routes nothing (the focused page owns its
      table). Consequence accepted as upstream parity: after clicking a
      topbar/sidebar control the letter keys go dead until the canvas is
      clicked or the page visibility changes -- same as upstream.
      GUI acceptance (build/acc_canvasfocus.ps1, screenshots acc_shots/CF_*):
      viewport-click I zoom True; button-focus I produces no zoom (parity);
      canvas click revives I zoom; button-focus Tab switches page; plus
      acc_freshkeys2.ps1 fresh-launch no-click I zoom + Tab True.
    evidence:
      gate: canonical gate 2026-09-13 incl.
        QmlUiAuditTests::platerHotkeysFollowCanvasFocus locking the design
        (page key functions + Keys delegation + visible focus claims,
        viewport forceActiveFocus on mouse-down, no window Keys forwarding,
        Tab/Shift+Tab Shortcuts gated on textEditHoldFocus);
        platerHotkeysMatchUpstreamTable Tab assertion reads main.qml;
        GUI acceptance build/acc_canvasfocus.ps1 + acc_shots/CF_*,
        build/acc_freshkeys2.ps1 + acc_shots/FK2_*
      commit: aaa6f13 (fix(hotkeys): canvas-focus model -- pages claim
        active focus, viewports grab it on mouse-down)
      last_verified: 2026-09-13

