    notes: >
      P17.5 (2026-08-29) delivered the RHI ghost-shell pass (extruder
      coloring, sliced geometry, alpha 0.15 -> upstream
      set_shell_transparency 0.15). 85d641f (2026-09-07) closed the
      per-volume lifecycle gap: the ghost buffer is built PER ModelBatch
      with upstream load_shells eligibility (only model-part volumes;
      modifier/negative/blocker/enforcer dropped, GCodeViewer.cpp:3163-3171)
      and per-volume extruder tint through the first-color fallback
      (update_colors_by_extruder, 3DScene.cpp:1216-1224); ModelBatch now
      carries extruderId; an empty eligible set is the explicit reset_shell
      transition (GCodeViewer.cpp:1193-1198, :3091-3095). A GPU-scale
      rewrite was NOT needed (ModelBatch already had object/volume/instance
      ranges). Two narrow accepted deviations remain (not the deferred
      per-volume lifecycle): (a) the shell cache keys on the Qt6 model
      generation instead of upstream print_id + get_modified_count, so a
      brand-new Print with an identical mesh keeps the old shell where
      upstream would rebuild; (b) an extruder-color-only change rebuilds
      through the full scene-generation path instead of a shells-only
      recolor (efficiency-only divergence).
