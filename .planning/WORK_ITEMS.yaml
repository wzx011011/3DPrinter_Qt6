# Canonical Work-Item Ledger — OWzx Slicer
#
# This file is the SINGLE source of truth for CURRENT task state.
# Other documents are views or evidence, never state owners:
#   - docs/源码对照迁移任务追踪.md      developer-readable feature-domain view (long form)
#   - docs/代码评审报告_2026-09-04.md   immutable 2026-09-04 review snapshot (findings only)
#   - .planning/REQUIREMENTS.md         v5.16 acceptance definitions (closed 2026-08-16)
#   - .planning/phases/*/…-SUMMARY.md   immutable per-phase execution evidence
#   - .planning/quick/*/…-SUMMARY.md    immutable one-shot task evidence
#
# Rules:
#   * One problem = one canonical id. Historical ids (R-P0.*, R-P1.*, G-*, P*.*) live
#     in `aliases` and must not be re-used as new work items.
#   * "phase complete", "requirement complete" and "ledger item complete" are
#     different claims; only this ledger claims source-truth parity state.
#   * Every verification claim must cite commit(s) + suite evidence + date.
#     A green run without a commit anchor is `stale`, not `pass`.
#
# Status model (four independent dimensions — do not collapse into one checkbox):
#   implementation: not_started | mock | hybrid | real
#   parity:         not_checked | partial | aligned | known_deviation
#   verification:   none | pass | fail | stale | partial
#   availability:   available | blocked_external | blocked_user_decision | declined | superseded

