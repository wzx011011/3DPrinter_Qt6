  - id: CAM-FLYAWAY-VIEWPLANE
    title: Viewport pan/zoom/orbit fly-away — switch to tight-frustum view-plane
      unprojection, clamp far-pivot orbit, recover from mouse-grab steal
    aliases: ["GAP-cam-flyaway"]
    area: Prepare/Canvas
    priority: P1
    status: resolved
    resolved: 2026-09-12
    implementation: real
    parity: aligned
    verification: pass
    availability: available
    notes: >
      User reported the plate camera "flies away" during mouse operations.
      Root causes located (3): (1) pan and zoom-to-mouse unprojected screen
      points onto the BED plane (y=0); at low camera elevation the ray runs
      near-horizon and the intersection lands kilometers away. Upstream
      unprojects onto the view-parallel plane through the CURRENT TARGET at
      the tight-frustum near z (GLCanvas3D.cpp:4011-4028 zoom_to_mouse,
      :4622-4638 pan-pick, calc_tight_frustrum_zs_around makes near =
      distance to the scene-box front) -- scene-bounded at ANY elevation.
      Fix: CameraController::viewPlanePoint(viewProj, viewport, screen,
      referencePoint) unprojects at the reference point's own depth;
      applyCameraPan and the wheel zoom-to-mouse round trip use it
      (CameraController.h/.cpp). (2) orbitAround never re-clamped the target
      after rotating around a far Ctrl-pivot, so a pivot at 1e5 mm swept the
      camera out of the scene; fix clamps the rotated target via
      clampTarget (upstream set_target deliberately does NOT validate
      -- Camera.cpp:81-85 -- but our translateWorld 3x-scene-box + upstream
      validate_target Camera.cpp:736-751 already gate pan, so orbit follows
      the same bound; Ctrl pivot itself clamped at press,
      GLCanvas3D.cpp:4583). (3) Qt Quick can steal the exclusive grab
      mid-drag (popup/overlay) and only mouseUngrabEvent fires -- the drag
      state stayed latched and the camera kept drifting; RhiViewport::
      mouseUngrabEvent now resets gizmo drag, button, paint, navigator/
      context press, Ctrl-pivot, cut-plane grab, press-pick indices and the
      rubber band. Tests: CameraParityTests viewPlanePointRoundTrip,
      viewPlanePointIsViewParallel (delta perp to forward),
      viewPlanePointStaysSceneBoundedAtLowElevation (5-deg elevation,
      full-viewport drag < ~630mm while groundPointOnPlane explodes),
      orbitAroundFarPivotKeepsTargetInScene, zoomToMouseCompositionStaysBounded.
    evidence:
      gate: canonical gate 2026-09-12 -- 12 suites 0 failed, CameraParity
        19/19 PASS incl. 5 new slots, E2E 32/0
      last_verified: 2026-09-12

