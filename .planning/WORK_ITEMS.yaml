      currentPlateGeometrySignature: object/volume/instance counts, ids,
      mesh sizes, transforms, config + supported/seam/mmu facet timestamps,
      printable flags) is unchanged and no calib params are involved;
      config-only changes flow through Print::apply diff invalidation with
      process() at the upstream default use_cache=false; mesh change, cancel,
      failure, calib, deletePlate, and project resets rebuild fully.
      deletePlate emits plateRemoved(printIndex) so the slot + result entry
      are released synchronously; startSlice reconciles pruned identities.
      ~SliceService cancels then joins the worker via QFuture. Review
      2026-09-04 P0-1 (shared locked map) and P0-2 (QThread wait-timeout
      qFatal) are resolved by design (single ownership; task wait, not
      thread wait). perf/waves divergence: use_cache=true was not ported
      (no upstream call site uses it; it force-completes invalidated steps).
      Batch 3 partial: 9fd126b persists existing PartPlateList width/depth and
      PartPlate instanceOutsideSet through the JSON fallback, with symmetric
      legacy-default loading; 859db5b fixes empty-model services to select that
      fallback instead of emitting an empty 3MF archive. This is not full
      upstream 3MF PlateData shape/exclude/extruder-area parity.
      Batch 4 (bed geometry round-trip) resolved d47a7ce. Scope correction
      from the upstream re-read: shape/exclude areas are NOT PlateData fields
      (bbs_3mf.hpp:52-108 has none) -- they persist as machine-config keys
      printable_area / bed_exclude_area / printable_height and load_project
      restores them via set_bed_shape -> PartPlateList::set_shapes
      (Plater.cpp:12996-12998, :8135-8169); "extruder areas" has no upstream
      PartPlate field. Qt6 save now embeds the plate-list bed geometry as
      typed config options (overlay keys keep priority); load parses them
      worker-side and applies setPlateSize + the new list-level
      PartPlateList::excludeAreas (upstream m_exclude_areas raw semantics,
      PartPlate.cpp:4898) before plates are created; JSON fallback mirrors
      the same fields.
      Batch 5 (arrange obstacles) resolved ccea3ac: arrangeObjects now feeds
      the two-list arrangement::arrange overload with the upstream fixed
      virtual objects -- bed_exclude_area rectangles as per-plate exclude
      polygons (preprocess_exclude_areas, PartPlate.cpp:4586-4623) and the
