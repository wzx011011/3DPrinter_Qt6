  - id: PLATE-PRINT-LIFECYCLE
    title: Persistent per-plate Print / GCodeResult ownership and deep plate semantics
    aliases: ["P0.5.5b/remainder"]
    area: Prepare/Plate
    priority: P1
    implementation: hybrid
    parity: partial
    verification: pass
    availability: available
    upstream:
      repo: third_party/OrcaSlicer
      refs:
        - src/slic3r/GUI/PartPlate.hpp (unprintable_plate, m_shape, m_exclude_areas)
        - src/slic3r/GUI/PartPlate.cpp:3141-3150, 4027-4065, 4110-4167, 4989-5044
    qt_targets:
      - src/core/model/PartPlate.h
      - src/core/model/PartPlateList.h/.cpp
      - src/core/services/SliceService.h/.cpp
    notes: >
      Stable printIndex allocation is DONE (see PLATE-RESULT-STABLE-KEY
      prerequisite and resolved PLATE-PRINT-IDENTITY). Still missing: durable
      Print/GCodeResult lifetime per plate, unprintable/shared plate semantics,
      full find_instance/contains geometry, plate shape/exclude/extruder
      areas, per-plate wipe-tower/Print context, complete slice-state/result
      API.
      Batch 1 (instance geometry + unprintable semantics) resolved 18dd03e:
      PartPlate gains m_shape storage with the origin-centered default
      rectangle (set_shape/calc_bounding_boxes semantics), contains(Vec3d),
      contains/intersects(BoundingBoxf3) with the BedEpsilon print volume
      (PartPlate.cpp:2694-2725), and findInstance(point) over member
      instances with injected ModelObject::instance_bounding_box bounds
      (notify_instance_update, PartPlate.cpp:4198-4250);
      PartPlateList::findInstance(BoundingBoxf3) + contains/intersects
      aggregates (:3948-3964, 4131-4149) and findInstanceAt(point) skip
      unprintable plates (upstream keeps unprintable_plate out of
      m_plate_list, PartPlate.hpp:541); updatePlateOrigins now writes
      per-plate size like upstream set_pos_and_size (:4004-4014, :1810);
      ProjectServiceMock attaches the bounds provider at every plate list
      (re)creation and exposes plateIndexAtPoint. Slice chain verified
      reading PartPlate::isPrintable domain state (export-all filter
      SliceService.cpp:1557; slice-all queue EditorViewModel::requestSliceAll).
      Batch 2 (durable per-plate Print / GCodeResult lifetime) resolved
      564a51d: SliceService keeps one persistent Slic3r::Print + applied model
      clone per plate keyed by stable printIndex (upstream PartPlate per-plate
      Print + GCodeResult, PartPlate.cpp:2839-2840), GUI-thread-exclusive
      single-owner handoff to the slice worker (no locks, no shared
      container). Incremental reslice judgment (conservative): reuse only when
      the plate geometry fingerprint (new ProjectServiceMock::
      currentPlateGeometrySignature: object/volume/instance counts, ids,
      mesh sizes, transforms, config + supported/seam/mmu facet timestamps,
      printable flags) is unchanged and no calib params are involved;
      config-only changes flow through Print::apply diff invalidation with
      process() at the upstream default use_cache=false; mesh change, cancel,
      failure, calib, deletePlate, and project resets rebuild fully.
      deletePlate emits plateRemoved(printIndex) so the slot + result entry
      are released synchronously; startSlice reconciles pruned identities.
      ~SliceService cancels then joins the worker via QFuture. Review
      2026-09-04 P0-1 (shared locked map) and P0-2 (QThread wait-timeout
      qFatal) are resolved by design (single ownership; task wait, not
      thread wait). perf/waves divergence: use_cache=true was not ported
      (no upstream call site uses it; it force-completes invalidated steps).
      Batch 3 partial: 9fd126b persists existing PartPlateList width/depth and
      PartPlate instanceOutsideSet through the JSON fallback, with symmetric
      legacy-default loading; 859db5b fixes empty-model services to select that
      fallback instead of emitting an empty 3MF archive. This is not full
      upstream 3MF PlateData shape/exclude/extruder-area parity.
      Batch 4 (bed geometry round-trip) resolved d47a7ce. Scope correction
      from the upstream re-read: shape/exclude areas are NOT PlateData fields
      (bbs_3mf.hpp:52-108 has none) -- they persist as machine-config keys
      printable_area / bed_exclude_area / printable_height and load_project
      restores them via set_bed_shape -> PartPlateList::set_shapes
      (Plater.cpp:12996-12998, :8135-8169); "extruder areas" has no upstream
      PartPlate field. Qt6 save now embeds the plate-list bed geometry as
      typed config options (overlay keys keep priority); load parses them
      worker-side and applies setPlateSize + the new list-level
      PartPlateList::excludeAreas (upstream m_exclude_areas raw semantics,
      PartPlate.cpp:4898) before plates are created; JSON fallback mirrors
      the same fields.
    remaining:
      - Viewport drop / out-of-bounds consumers adopting the point/box
        primitives, blocked on the GL<->slic3r bed-rect coordinate
        unification; wipe-tower-as-arrange-obstacle
        (estimate_wipe_tower_polygon, PartPlate.cpp:1739-1777) joins that
        same coordinate-gated batch.
      - Sub-scope into separate items when work starts; do not mark P0.5.5b
        complete until this item closes.
    evidence:
      commits: [18dd03e, 564a51d, 9fd126b, 859db5b, d47a7ce]
      tests:
        - tests/PartPlateTests.cpp::platePrintVolumeContainsTests
        - tests/PartPlateTests.cpp::plateFindInstancePointLookup
        - tests/PartPlateTests.cpp::plateListBoxAndPointLookups
        - tests/PartPlateTests.cpp::unprintablePlateExcludedFromFindInstanceAt
        - tests/PartPlateTests.cpp::servicePlateIndexAtPointUsesInstanceBounds
        - tests/PartPlateTests.cpp::jsonPersistenceRoundTripGeometryAndOutsideState
        - tests/PartPlateTests.cpp::plateBedShapeRoundTripsThroughProject
        - tests/E2EWorkflowTests.cpp::test_persistent_print_reused_on_same_plate_reslice
        - tests/E2EWorkflowTests.cpp::test_plate_deletion_releases_persistent_print_entry
        - tests/E2EWorkflowTests.cpp::test_cancelled_slice_restart_rebuilds_persistent_print
      gate batch 2: canonical run EXIT=0 2026-09-06, 12 suites 574 tests
        0 failed 0 skipped (E2E 32 incl. the 3 new slots, PartPlate 66,
        ViewModelSmoke 187, QmlUiAudit 171); batch 3 follow-up gate also
        EXIT=0 with 12 suites and 575 tests (PartPlate 67), 0 failed and
        0 skipped; one prior interim run's
        PartPlate/E2E 0xC0000005 was the known stale-obj-after-header-change
        issue, green after purging objs older than SliceService.h
      gate batch 4 2026-09-07: post ninja -t clean full rebuild, in-run
        PrepareScene 23 / PartPlate 68 (incl. the bed-shape round-trip) /
        AppTool 10 / ObjectPicking 7 all green; ViewModelSmoke hit the
        known dirWritable=0 AV file-churn flake on
        projectStoreWritesThumbnailFamily in-run (186/187) but passed
        187/187 EXIT=0 on the standalone rerun, and QmlUiAudit,
        PreviewParser, Navigator, Camera, ViewportContextMenu,
        GizmoGeometry, and E2E all passed EXIT=0 on standalone reruns
      gate: canonical run after ninja -t clean full rebuild EXIT=0 2026-09-06,
        12 suites 571 tests 0 failed (PartPlate 66 incl. the 5 new slots);
        one in-suite ViewModelSmoke write flake (dirWritable=0, known AV
        file-churn G-11 pattern) passed 187/187 on the individual rerun
      last_verified: 2026-09-07

