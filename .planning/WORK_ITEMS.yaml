  - id: AI-SIDECAR-STARTUP-RACE
    title: OPEN P0 -- app dies ~30-100s after launch with AI sidecar enabled (worker-thread heap corruption in Qt connection bookkeeping)
    aliases: ["SIDECAR-RACE", "AI-STARTUP-CRASH"]
    area: AI/Platform
    priority: P0
    status: open
    implementation: real
    parity: n/a
    verification: manual-visual
    availability: degraded
    notes:
      First observed 2026-09-13 14:19 (crash dumps 14:19 + 23:51), 2026-09-15
      repro 6/6 launches dead within ~100s (empty scene or loaded model).
      Signature: 0xc0000005 in Qt6Core!QObjectPrivate::removeConnection
      reading 0xcccccccc-poisoned memory; handler backtrace = worker thread
      (trampoline -> app thunks T+0x27bce0/T+0x280070 -> Qt internals ->
      unmapped address outside any loaded module = code-unloaded-under-
      thread / stack smash on a worker). TOGGLE PROVEN: renaming build/
      ai_sidecar away -> app fully stable (461MB, loaded model, >100s,
      interactive); sidecar present -> dies. In-app AI code (McpHttpServer,
      AiAgentService) audited GUI-thread-clean and bounded (restart max 3);
      the racing worker thread identity still unknown. HARDENING SHIPPED:
      (1) main_qml.cpp puts the process into a kill-on-close job object so
      the sidecar tree can never outlive the app (orphaned SDK clients
      reconnecting to the next instance's fixed aiPort 27417 caused an
      escalating cascade; 4 node.exe + 2 python.exe orphans found and
      reaped 2026-09-15); (2) CrashHandlerWin adds MiniDumpWithUnloadedModules
      so code-unloaded frames become attributable on next occurrence.
      NOTE: GUI acceptance of WAVE1-BATCH-A (empty-click deselect) was
      blocked by this crash; code+audit verified, interactive verification
      deferred until the race is fixed. Machine context: engine->load time
      doubled since 2026-09-13 morning (timing-sensitive race).
      HARDENING ROUND 2 (2026-09-15, post-5010451 experiments):
      - Experiment matrix: crash reproduces with sidecar spawn deferred to
        +8s; with QT_D3D_NO_VBLANK_THREAD=1; with QT_ACCESSIBILITY=0; with
        OWZX_DISABLE_WEBENGINE=1. ONLY stable configuration remains
        ai_sidecar files absent (no spawn, no client). Spawn timing and all
        tested env escapes do NOT clear it; a speculative 8s deferral was
        tried and REVERTED (no observed benefit).
      - CrashHandlerWin upgrade: per-frame module file names via
        SymGetModuleInfo64 (handler trace now reads
        "Qt6Core.dll!... +0x182" instead of bare letters) +
        AddVectoredExceptionHandler for fail-fast codes 0xC0000409/41x
        which bypass SetUnhandledExceptionFilter (explains the silent
        exit-0 variant with no dump). New crash 2026-09-15 01:34:26
        captured: worker thread, Qt6Core!removeConnection+0x182 (matches
        live cdb), app frames T+0x27c220 (deletes a QObject) inside
        T+0x2805b0 (thread proc; 20 indirect Qt calls: QString/QVariant
        member-wise moves = config/params struct move). Qt6Gui x2 +
        Qt6Quick x1 frames nested = the thread touches Quick-side objects.
        Process uptime 17s (dump-verified).
      - NEXT (root cause plan): identify thread 0x2805b0 owner by live
        breakpoint under cdb (bp OWzxSlicer+0x28054e, k on hit); audit
        SliceService dedicated-thread discipline (R-P0.1/R-P0.2 known UB)
        as candidate heap-corruption source; consider disabling AI auto
        start by default until fixed.
      - ROOT-CAUSE REFRAME (2026-09-15, PDB-symbolized dump
        FramelessDialogDemo_20260915_015731_449): the crashing thread is the
        MAIN/GUI thread (full unwind: RtlUserThreadStart -> CRT -> main ->
        QCoreApplication::exec -> QEventLoop::exec ->
        QWindowsGuiEventDispatcher::processEvents -> sendPostedEvents ->
        notifyInternal2 -> QQuickWindow::event -> QMetaCallEvent::
        placeMetaCall -> app lambda). NOT a worker thread. Two victim
        manifestations of the same heap corruption: (a) AV inside
        QList<QVector3D>::reserve while a queued mesh-update lambda runs,
        (b) AV in QObjectPrivate::removeConnection during disconnect from
        the same lambda family. The queued lambda runs AFTER some earlier
        code already freed/smashed the heap -> sidecar presence is only a
        load/timing trigger (memory pressure shifts heap layout).
      - PRIME SUSPECT FAMILIES (ledger R-P0.1/R-P0.2 + R-P1.G): SliceService
        dedicated-thread lock-free sharing of m_persistentSlices (known UB),
        RhiViewportRenderer releaseResources missing m_supportPreviewBuffer
        (R-P1.G) racing the queued mesh-upload lambdas
        (QList<QVector3D> = meshData vertex list).
      - TOOLING NOW AVAILABLE: OWZX_ENABLE_PDB=ON (existing CMake option,
        set in build/CMakeCache, 1.2GB PDB beside the exe) gives full PDB
        symbolization for cdb/dump analysis; CrashHandlerWin still needs a
        fix -- the dump's stored exception context is the handler thread's
        (MiniDumpWriteDump ran after registers were clobbered), so .ecxr is
        unusable; symbolize via the handler's 19-frame address list +
        cdb `ln` instead, or fix the handler to capture ContextRecord into
        a MiniDump context stream before any register-clobbering call.
      - NEXT: reproduce under PageHeap (gflags /p /enable, requires admin)
        to fault AT the culprit write, or audit R-P0.1/R-P1.G directly with
        the PDB live breakpoints.
      - ROUND 3 FINDINGS (2026-09-15): (1) TRUE EXIT CODE captured via cmd
        wrapper ERRORLEVEL: 0xC0000374 STATUS_HEAP_CORRUPTION -- ntdll
        detected corrupted heap metadata at a LATER heap operation; this
        fail-fast bypasses SEH/VEH/unhandled-filter, which is why most runs
        die with no dump and no crash-log entry (the AV dumps seen earlier
        are the rarer victim manifestation). (2) SliceService R-P0.1 spot
        audit: the cited lock-free sharing is GONE in current code --
        single-ownership persistentSlot handed to the worker, completion via
        queued lambda with generation gate, destructor cancel-then-join
        (batch-2 hardening); suspect DEMOTED. (3) gflags/PageHeap blocked in
        this environment (registry write requires admin: access denied).
      - REMAINING SUSPECTS (heap-corruption culprits consistent with a
        GUI-thread queued-mesh-lambda victim): R-P1.G RhiViewportRenderer
        releaseResources missing m_supportPreviewBuffer + uploadModelBuffer
        mixed-state (renderer-thread vs GUI-thread object lifetime);
        R-P1.C stale m_mockLayerRanges/overrides indices after
        deleteObject/split/assemble (unchecked QList operator[] writes);
        restoreVolumeSnapshot metadata loss (R-P1.K). Audit order:
        R-P1.G first (renderer teardown vs queued mesh upload is exactly
        the victim path), then R-P1.C index arithmetic.
      - NOTE: handler-side diagnostics may now be redundant -- the crash is
        heap-corruption fail-fast; the productive path is a targeted
        lifetime audit of the two families above with live PDB breakpoints
        (cdb bp via command file works: put bp + "k; gc" in a -cf file).
    evidence:
