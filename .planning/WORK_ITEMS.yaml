  - id: THUMBFAMILY-GATE-ENV
    title: projectStoreWritesThumbnailFamily fails deterministically in
      full-suite runs (suite-state dependent store_bbs_3mf failure)
    aliases: ["gate-env-flake"]
    area: Testing
    priority: P1
    status: resolved
    resolved: 2026-09-10
    implementation: real
    parity: aligned
    verification: pass
    availability: available
    notes: >
      RESOLVED 2026-09-10 -- not environment, a real use-after-free.
      store_bbs_3mf's StoreParams::path is a borrowed const char*
      (bbs_3mf.hpp:211), but storeProject3mf assigned
      filePath.toUtf8().constData() (ProjectServiceMock.cpp:10836): the
      temporary QByteArray died at the end of that statement, and the
      function's later allocations (buildPlateDataList, thumbnail vectors,
      overlay config) recycled the heap block before the writer copied the
      path. boost's error log in the canonical native log showed the writer
      opening the corrupted path 'E:/ai/3D\x10?\x15t\x19.tmp' -- explaining
      every prior symptom: standalone passes (fresh heap rarely recycles the
      block), deterministic full-suite failure (~35 prior tests churn the
      heap), tmpExists=0 (fopen on a garbage path fails), and the
      dirWritable=0 red herring. Fix: named QByteArray local (storePathUtf8)
      outliving the call, same contract as the snapshot writer (pathBytes).
      Repo-wide audit found no other assignment-style borrows of temporary
      QString conversions into libslic3r pointers. Verification:
      ViewModelSmokeTests full suite 3/3 runs green (195 passed, 0 failed,
      Totals written) versus the deterministic pre-fix failure; the
      suite-end premature death (no Totals) also disappeared. Canonical
      gate 2026-09-10: all 12 suites green (588 tests, 0 failures) +
      Launch + E2E 32/0.

